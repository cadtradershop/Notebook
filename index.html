<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Notebook</title>

    <!-- ===== PWA ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b5532a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Notebook">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            box-sizing: border-box;
            --bg: #f6f3ec;
            --card: #fffdf8;
            --ink: #2b2a27;
            --mute: #8a867c;
            --line: #e4dfd2;
            --acc: #b5532a;
            --accink: #fff;
            --sel: #f0e8d6
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #1d1c1a;
                --card: #262522;
                --ink: #ece8de;
                --mute: #9a958a;
                --line: #37352f;
                --acc: #e08a5c;
                --accink: #1d1c1a;
                --sel: #33302a;
                --hlink: #222
            }
        }

        :root[data-theme="dark"] {
            --bg: #1d1c1a;
            --card: #262522;
            --ink: #ece8de;
            --mute: #9a958a;
            --line: #37352f;
            --acc: #e08a5c;
            --accink: #1d1c1a;
            --sel: #33302a;
            --hlink: #222
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            background: var(--card);
            position: relative;
            z-index: 25
        }

        header h1 {
            font-size: 30px;
            margin: 0;
            flex: 1;
            font-weight: 650;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        button {
            font: inherit;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            padding: 0 14px;
            min-height: 42px;
            white-space: nowrap
        }

        button.pri {
            background: var(--acc);
            color: var(--accink);
            border-color: var(--acc);
            font-weight: 600
        }

        button:active {
            filter: brightness(.92)
        }

        #menuBtn {
            display: none;
            font-size: 20px;
            padding: 0 12px
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative
        }

        aside {
            width: 260px;
            border-right: 1px solid var(--line);
            padding: 10px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        #list {
            flex: 1;
            overflow-y: auto;
            min-height: 0
        }

        .item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 6px 10px 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            margin-bottom: 4px
        }

        .item.on {
            background: var(--sel);
            border-color: var(--line)
        }

        @media (hover:hover) {
            .item:hover {
                background: var(--sel);
                border-color: var(--line)
            }
        }

        .item .main {
            flex: 1;
            min-width: 0
        }

        .item .t {
            display: block;
            width: 100%;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            background: transparent;
            border: 0;
            border-bottom: 1px dashed transparent;
            border-radius: 0;
            padding: 0 0 2px;
            outline: none;
            text-overflow: ellipsis
        }

        .item .t[readonly] {
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none
        }

        .item .t::placeholder {
            color: var(--mute);
            font-weight: 500
        }

        .item .t.editing {
            cursor: text;
            border-bottom-color: var(--mute)
        }

        .item small {
            display: block;
            color: var(--mute);
            font-size: 12px;
            margin-top: 2px
        }

        .item .x {
            flex-shrink: 0;
            width: 36px;
            min-height: 36px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--mute);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color .15s, background .15s
        }

        .item .x svg {
            width: 19px;
            height: 19px;
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none
        }

        @media (hover:hover) {
            .item .x:hover {
                color: var(--acc);
                background: var(--line)
            }
        }

        .item .x:active {
            color: var(--acc)
        }

        section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 14px;
            min-width: 0;
            min-height: 0;
            gap: 10px
        }

        #title {
            font: inherit;
            font-size: 22px;
            font-weight: 650;
            border: 0;
            border-bottom: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            padding: 6px 2px;
            outline: none;
            width: 100%;
            border-radius: 0
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            position: relative
        }

        .tools .sep {
            width: 1px;
            height: 22px;
            background: var(--line);
            margin: 0 2px
        }

        .cbtn {
            position: relative
        }

        .cbtn .cbar {
            position: absolute;
            left: 9px;
            right: 9px;
            bottom: 4px;
            height: 3px;
            border-radius: 2px;
            background: var(--ink)
        }

        .cbtn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block;
            margin: -3px auto 0
        }

        #pal {
            position: absolute;
            z-index: 12;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .2);
            width: min(236px, 92vw)
        }

        #pal[hidden] {
            display: none
        }

        #pal button {
            min-width: 0
        }

        #pal .sw {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        #pal .swb {
            width: 30px;
            height: 30px;
            min-height: 30px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid var(--line)
        }

        #pal .prow {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px
        }

        #pal .prow button {
            min-height: 32px;
            padding: 0 10px;
            font-size: 13px
        }

        #pal .custom {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto
        }

        #pal input[type=color] {
            width: 34px;
            height: 28px;
            padding: 0;
            border: 1px solid var(--line);
            background: none;
            border-radius: 6px
        }

        #body [style*="background-color"] {
            color: var(--hlink, inherit)
        }

        .tools button {
            min-height: 34px;
            min-width: 42px;
            padding: 0 12px;
            font-size: 14px
        }

        #body {
            flex: 1;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            line-height: 1.6;
            padding: 14px;
            outline: none;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
            -webkit-user-select: text;
            user-select: text
        }

        #body.empty::before {
            content: attr(data-placeholder);
            position: absolute;
            top: 14px;
            left: 14px;
            color: var(--mute);
            pointer-events: none
        }

        #body b,
        #body strong {
            font-weight: 700
        }

        #body hr {
            border: 0;
            border-top: 1px solid var(--mute);
            margin: 6px 0;
            height: 0;
            overflow: visible
        }

        #body ul {
            margin: 4px 0;
            padding-left: 26px
        }

        .ibtn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block;
            margin: 0 auto
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .actions span {
            color: var(--mute);
            font-size: 18px;
            flex: 1;
            min-width: 0
        }

        .actions #delBtn,
        .actions #pdfBtn {
            flex: 0 0 auto;
            min-width: 0;
        }

        #delBtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 0 12px;
        }

        #delBtn svg {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        #delBtn span {
            display: inline-block;
            line-height: 1;
            white-space: nowrap;
        }

        #scrim {
            display: none
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--bg);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 60;
            max-width: 90%
        }

        #toast.show {
            opacity: 1
        }

        #dlg {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px
        }

        #dlg[hidden] {
            display: none
        }

        #dlg .box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 18px;
            width: min(340px, 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3)
        }

        #dlg p {
            margin: 0 0 16px;
            font-size: 16px
        }

        #dlg .row {
            display: flex;
            gap: 8px;
            justify-content: flex-end
        }

        @media(max-width:700px) {
            #menuBtn {
                display: inline-block
            }

            aside {
                position: absolute;
                z-index: 20;
                top: 0;
                bottom: 0;
                left: 0;
                width: 82%;
                max-width: 320px;
                transform: translateX(-102%);
                transition: transform .22s;
                box-shadow: 2px 0 14px rgba(0, 0, 0, .25)
            }

            body.drawer aside {
                transform: none
            }

            body.drawer #scrim {
                display: block;
                position: absolute;
                inset: 0;
                z-index: 15;
                background: rgba(0, 0, 0, .35)
            }

            section {
                padding: 10px
            }

            #title {
                font-size: 20px
            }

            .item .t {
                font-size: 16px
            }

            .tools .sep {
                display: none
            }

            .tools button {
                min-width: 38px;
                padding: 0 8px
            }

            .actions {
                flex-wrap: wrap
            }

            .actions span {
                flex-basis: 100%;
                order: 3;
                text-align: center
            }

            .actions #delBtn,
            .actions #pdfBtn {
                flex: 1 1 0;
            }
        }

        .brand-theme {
            color: #E99060;
        }

        .brand-white {
            color: var(--ink);
        }
    </style>
</head>

<body>
    <header>
        <button id="menuBtn" aria-label="Open notes menu">☰</button>
        <h1 aria-label="Notebook"><span class="brand-theme">N</span><span class="brand-white">ote</span><span class="brand-theme">b</span><span class="brand-white">o</span><span class="brand-theme">o</span><span class="brand-white">k</span></h1>
        <button id="newBtn" class="pri">+ New</button>
    </header>
    <main>
        <aside>
            <div id="list"></div>
        </aside>
        <div id="scrim"></div>
        <section>
            <input id="title" placeholder="Title" maxlength="120" autocomplete="off">
            <div class="tools">
                <button id="boldBtn" type="button" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
                <button id="italicBtn" type="button" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
                <button id="underBtn" type="button" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
                <span class="sep"></span>
                <button id="smallBtn" type="button" title="Smaller text (Ctrl+Shift+−)"
                    aria-label="Smaller text">A−</button>
                <button id="bigBtn" type="button" title="Bigger text (Ctrl+Shift++)"
                    aria-label="Bigger text">A+</button>
                <span class="sep"></span>
                <button id="colorBtn" class="cbtn" type="button" title="Text color" aria-label="Text color"><span
                        style="font-weight:700">A</span><i class="cbar" id="colorBar"></i></button>
                <button id="hiBtn" class="cbtn" type="button" title="Highlight color" aria-label="Highlight color"><svg
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                    </svg><i class="cbar" id="hiBar" style="background:#fff3a3"></i></button>
                <span class="sep"></span>
                <button id="hrBtn" class="ibtn" type="button" title="Insert horizontal line" aria-label="Insert horizontal line"><svg
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 5h10M7 19h10" stroke-width="1.5" opacity=".5" />
                        <path d="M2.5 12h19" />
                    </svg></button>
                <div id="pal" hidden></div>
            </div>
            <div id="body" class="empty" contenteditable="true" role="textbox" aria-multiline="true"
                data-placeholder="Write your notes here..."></div>
            <div class="actions">
                <button id="delBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M5 6l1 14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-14"/><path d="M10 11v6"/><path d="M14 11v6"/></svg><span>Delete</span></button>
                <button id="pdfBtn" type="button" class="pri">⬇ Download PDF</button>
                <span id="status"></span>
            </div>
        </section>
    </main>
    <div id="dlg" hidden>
        <div class="box">
            <p id="dlgMsg"></p>
            <div class="row"><button id="dlgNo" type="button">Cancel</button><button id="dlgYes" type="button" class="pri">Delete</button></div>
        </div>
    </div>
    <div id="toast"></div>
    <script>
        const KEY = 'notebook_notes_v1';
        let notes = [], curId = null, timer = null, suppressClick = false;
        const $ = id => document.getElementById(id);
        const bodyEl = $('body');
        try { document.execCommand('defaultParagraphSeparator', false, 'div') } catch (e) { }

        function load() {
            try { notes = JSON.parse(localStorage.getItem(KEY) || '[]') } catch (e) { notes = [] }
            if (!Array.isArray(notes)) notes = [];
            notes.sort((a, b) => parseInt(a.id, 36) - parseInt(b.id, 36));
        }
        function persist() { try { localStorage.setItem(KEY, JSON.stringify(notes)); return true } catch (e) { return false } }
        function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200) }
        function fmt(ts) { return new Date(ts).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) }
        function drawer(on) {
            document.body.classList.toggle('drawer', on);
            const b = $('menuBtn'); b.textContent = on ? '✕' : '☰';
            b.setAttribute('aria-label', on ? 'Close notes menu' : 'Open notes menu');
        }
        function itemEl(id) { return $('list').querySelector('.item[data-id="' + id + '"]') }

        function askConfirm(msg) {
            return new Promise(res => {
                $('dlgMsg').textContent = msg; $('dlg').hidden = false;
                const done = v => { $('dlg').hidden = true; $('dlgYes').onclick = $('dlgNo').onclick = null; res(v) };
                $('dlgYes').onclick = () => done(true);
                $('dlgNo').onclick = () => done(false);
            });
        }

        /* ---------- rich text helpers ---------- */
        const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const textToHtml = t => String(t || '').split('\n').map(l => '<div>' + (l ? esc(l) : '<br>') + '</div>').join('');
        const OK_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'SPAN', 'DIV', 'P', 'BR', 'HR', 'UL', 'LI']);
        const CSS_COLOR = /^(#[0-9a-f]{3,8}|rgba?\(\s*[\d.\s,%]+\)|[a-z]{3,20})$/i;
        function clean(html) {
            const t = document.createElement('template'); t.innerHTML = html;
            (function go(parent) {
                [...parent.childNodes].forEach(n => {
                    if (n.nodeType === 3) return;
                    if (n.nodeType !== 1) { n.remove(); return }
                    if (!OK_TAGS.has(n.tagName)) {
                        if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|TEMPLATE|NOSCRIPT)$/.test(n.tagName)) { n.remove(); return }
                        go(n);
                        while (n.firstChild) parent.insertBefore(n.firstChild, n);
                        n.remove(); return;
                    }
                    const fs = n.style && n.style.fontSize, col = n.style && n.style.color, bg = n.style && n.style.backgroundColor;
                    [...n.attributes].forEach(a => n.removeAttribute(a.name));
                    if (fs && /^\d+(\.\d+)?px$/.test(fs)) n.style.fontSize = fs;
                    if (col && CSS_COLOR.test(col)) n.style.color = col;
                    if (bg && CSS_COLOR.test(bg)) n.style.backgroundColor = bg;
                    go(n);
                });
            })(t.content);
            return t.innerHTML;
        }
        function updateEmpty() {
            const h = bodyEl.innerHTML;
            bodyEl.classList.toggle('empty', h === '' || h === '<br>' || h === '<div><br></div>');
        }
        function noteHtml(n) { return n.html != null && n.html !== '' ? clean(n.html) : textToHtml(n.body) }

        /* ---------- formatting actions ---------- */
        function restoreSel() {
            if (document.activeElement === bodyEl || !lastRange) return;
            bodyEl.focus();
            const s = window.getSelection(); s.removeAllRanges(); s.addRange(lastRange);
        }
        function fmtCmd(cmd) {
            restoreSel();
            if (document.activeElement !== bodyEl) bodyEl.focus();
            document.execCommand('styleWithCSS', false, false);
            document.execCommand(cmd);
            updateEmpty(); queueSave();
        }
        const toggleBold = () => fmtCmd('bold');
        function stripSentinel() {
            bodyEl.querySelectorAll('span[style]').forEach(sp => {
                if (sp.style.color === 'rgb(1, 2, 3)') sp.style.removeProperty('color');
                if (sp.style.backgroundColor === 'rgb(1, 2, 4)') sp.style.removeProperty('background-color');
                if (!(sp.getAttribute('style') || '').trim()) sp.removeAttribute('style');
                if (!sp.attributes.length) { while (sp.firstChild) sp.parentNode.insertBefore(sp.firstChild, sp); sp.remove() }
            });
        }
        function applyColor(kind, color) {
            restoreSel();
            if (document.activeElement !== bodyEl) bodyEl.focus();
            const c = color || (kind === 'fore' ? '#010203' : '#010204');
            document.execCommand('styleWithCSS', false, true);
            if (kind === 'fore') document.execCommand('foreColor', false, c);
            else if (!document.execCommand('hiliteColor', false, c)) document.execCommand('backColor', false, c);
            document.execCommand('styleWithCSS', false, false);
            if (!color) stripSentinel();
            const bar = $(kind === 'fore' ? 'colorBar' : 'hiBar');
            bar.style.background = color || (kind === 'fore' ? 'var(--ink)' : '#fff3a3');
            lastColor[kind] = color || lastColor[kind];
            updateEmpty(); queueSave();
        }
        function changeSize(dir) {
            restoreSel();
            const sel = window.getSelection();
            if (!sel.rangeCount) { toast('Select some text first'); return }
            const r = sel.getRangeAt(0).cloneRange();
            if (r.collapsed || !bodyEl.contains(r.commonAncestorContainer)) { toast('Select some text first'); return }
            let sc = r.startContainer, so = r.startOffset, ec = r.endContainer, eo = r.endOffset;
            if (ec.nodeType === 3 && eo < ec.length) ec.splitText(eo);
            if (sc.nodeType === 3 && so > 0) { const t = sc.splitText(so); if (sc === ec) ec = t; sc = t }
            if (sc.nodeType === 3) so = 0;
            if (ec.nodeType === 3) eo = ec.length;
            r.setStart(sc, so); r.setEnd(ec, eo);
            const texts = [];
            const w = document.createTreeWalker(bodyEl, NodeFilter.SHOW_TEXT);
            while (w.nextNode()) { const t = w.currentNode; if (t.nodeValue && r.intersectsNode(t)) texts.push(t) }
            if (!texts.length) { toast('Select some text first'); return }
            texts.forEach(t => {
                const par = t.parentNode;
                const cur = parseFloat(getComputedStyle(par).fontSize) || 16;
                const next = Math.min(96, Math.max(8, Math.round(cur + dir * 2)));
                if (par !== bodyEl && par.tagName === 'SPAN' && par.childNodes.length === 1) { par.style.fontSize = next + 'px' }

        /* ---------- note list ---------- */

        function open(id) {

        async function deleteNote(id) {

        /* ---------- PDF ---------- */
        function docToLines(root) {

            const nl = () => lines.push([]);

                if (blk && cur().length) nl();

                node.childNodes.forEach(c => walk(c, s));

        function buildPages(title, lines) {

                });

                    }

        async function exportPdf() {
            try {

        /* ---------- PWA: dynamic theme-color + service worker ---------- */
